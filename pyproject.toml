[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "football-passing-chain"
version = "0.1.0"
description = "Six-gate passing chain (freeze, attempt, choice, arrival, control, resolution) fitted on banked tracking; IDSSE measured truth, 360 and broadcast as context"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
