name: verify

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install "ruff==0.13.3" "mypy==2.4.1"
      - run: pytest -x -q
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/
      - run: mypy --strict src/
      - run: python3 scripts/reproduce.py
      - name: tighten proof (completion block on generated-figure changes)
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^(scripts/figures\.py|scripts/reproduce\.py)$'; then
            git log -1 --pretty=%B | grep -q 'style-source:' || { echo "figures.py changed without skill completion block (missing style-source:). Run the tighten-code skill first."; exit 1; }
          fi
