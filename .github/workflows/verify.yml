name: verify

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install "ruff==0.13.3" "mypy==2.4.1"
      - run: pytest -x -q
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/
      - run: mypy --strict src/
      - run: python3 scripts/reproduce.py
      - name: tighten bars (nesting depth cap)
        run: |
          python3 - <<'PYEOF'
          import ast, pathlib, sys
          def maxdepth(tree):
              best = [0]
              def visit(n, d):
                  if isinstance(n, (ast.If, ast.For, ast.While, ast.With)):
                      d += 1
                      best[0] = max(best[0], d)
                  for c in ast.iter_child_nodes(n):
                      visit(c, d)
              visit(tree, 0)
              return best[0]
          bad = []
          for f in ["scripts/figures.py", "scripts/reproduce.py"]:
              p = pathlib.Path(f)
              if not p.exists():
                  continue
              md = maxdepth(ast.parse(p.read_text()))
              if md > 2:
                  bad.append(f"{f}: nesting depth {md} > 2 (tighten rule 3)")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("tighten bars clean")
          PYEOF
